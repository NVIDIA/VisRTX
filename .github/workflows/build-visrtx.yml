name: VisRTX CI
on:
  push:
    branches: [ next_release ]
    paths:
      - 'devices/**'
      - '.github/actions/**'
      - '.github/workflows/build-visrtx.yml'
  pull_request:
    branches: [ main, next_release ]
    paths:
      - 'devices/**'
      - '.github/actions/**'
      - '.github/workflows/build-visrtx.yml'

# Cancel superseded PR runs; let next_release pushes finish (green history).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        cudaversion: ['12.4.1', '13.0.2']
        config: [Release, Debug]
        include:
          - os: linux
            runs-on: ubuntu-22.04
            generator: Ninja
          - os: windows
            runs-on: windows-2022
            generator: Ninja
    runs-on: ${{ matrix.runs-on }}
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
      - name: Setup CUDA Toolkit
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.cudaversion }}
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
      - name: Restore sccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-visrtx-${{ runner.os }}-cuda${{ matrix.cudaversion }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            sccache-visrtx-${{ runner.os }}-cuda${{ matrix.cudaversion }}-${{ matrix.config }}-
      - name: Build ANARI-SDK
        uses: ./.github/actions/build-anari-sdk
        with:
          config: ${{ matrix.config }}
          install-prefix: ${{ github.workspace }}/deps
          build-deps-path: devices/rtx/cmake/build_deps
          generator: ${{ matrix.generator }}
      - name: Configure VisRTX
        run: >
          cmake -LA -G "${{ matrix.generator }}" -B ${{github.workspace}}/build-visrtx
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/deps
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DVISRTX_BUILD_RTX_DEVICE=ON
          -DVISRTX_PRECOMPILE_SHADERS=OFF
          -DVISRTX_BUILD_GL_DEVICE=OFF
          -DVISRTX_BUILD_TSD=OFF
      - name: Install VisRTX
        run: >
          cmake --build ${{ github.workspace }}/build-visrtx --config ${{ matrix.config }} --target install --parallel
      - name: sccache stats
        run: sccache --show-stats
      - name: Save sccache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-visrtx-${{ runner.os }}-cuda${{ matrix.cudaversion }}-${{ matrix.config }}-${{ github.sha }}
