[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsdjupyter"
version = "0.1.0"
description = "TSD Jupyter — Jupyter widget for interactive remote rendering via a TSD server"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = ["anywidget>=0.9", "ipywidgets>=8.0", "Pillow>=9.0"]

[project.optional-dependencies]
dev = ["jupyterlab", "notebook"]

[tool.hatch.build.targets.wheel]
packages = ["tsdjupyter"]
